name: Build

on: [push]

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build
              run: |
                mvn -B package --file pom.xml
                mkdir staging && cp target/*.jar staging

            - name: upload as artifact
              uses: actions/upload-artifact@v2
              with:
                name: github-actions-artifact
                path: staging